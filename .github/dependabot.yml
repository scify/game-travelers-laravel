# Policy: security PRs only. Version updates are off for every ecosystem.
# Dependencies move by hand when there is a reason: a vulnerability that
# affects us, or a feature we need. Never for a new version alone.
# Actions stay SHA-pinned; when a pin must move, verify the SHA against
# the upstream tag before committing it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: '18:00'
      timezone: Europe/Athens
    open-pull-requests-limit: 0 # no version updates
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: '18:00'
      timezone: Europe/Athens
    open-pull-requests-limit: 0 # no version updates
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: thursday
      time: '18:00'
      timezone: Europe/Athens
    open-pull-requests-limit: 0 # no version updates
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
