# DDEV configuration for local development.
# Reference: https://ddev.readthedocs.io/en/stable/users/configuration/config/
name: travelers
type: laravel
docroot: public
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
    type: mysql
    version: "8.0"
# Uploaded files live in storage/, outside the web root. The path is relative
# to the docroot: a plain "storage" would mean public/storage, which then
# blocks the symlink artisan storage:link puts there.
upload_dirs:
    - ../storage
use_dns_when_possible: true
timezone: Europe/Athens
composer_version: "2"
# Node.js version. Must match .nvmrc; the post-start hook below keeps them in step.
nodejs_version: "24.21.0"
corepack_enable: false
# Vite's development server, reached by the browser through the DDEV router.
# Three numbers must be equal: container_port, where Vite listens inside the
# container; https_port, where the browser reaches it; and VITE_DEV_PORT, which
# vite.config.js uses for the listen port and for the origin. http_port only
# has to be free. Each project on one machine needs its own set.
# vite.config.js reads VITE_DEV_PORT from the environment, not from .env.
web_extra_exposed_ports:
    - name: vite
      container_port: 5151
      http_port: 5150
      https_port: 5151
web_environment:
    - VITE_DEV_PORT=5151
ddev_version_constraint: ">= 1.25.3"
hooks:
    post-start:
        - exec: bash .ddev/scripts/sync-node-version.sh
